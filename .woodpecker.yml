# Woodpecker 同样只调用 scripts/ci.sh；工具链由 runner/image 提供。
when:
  event: [push, pull_request, manual]

steps:
  web:
    image: node:20
    commands:
      - ./scripts/ci.sh install
      - ./scripts/ci.sh check-web
      - ./scripts/ci.sh scan

  rust:
    image: node:20
    commands:
      - ./scripts/ci.sh install
      - ./scripts/ci.sh build-web
      - ./scripts/ci.sh check-rust

  build-macos:
    image: rust:1.77
    when:
      event: [manual]
    commands:
      - ./scripts/ci.sh build-macos
