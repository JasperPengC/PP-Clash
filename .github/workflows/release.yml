name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install deps
        run: npm ci
      - name: Fetch bundled kernel
        env:
          KERNEL_ZIP_URL: ${{ vars.KERNEL_ZIP_URL }}
        run: |
          if [ -z "$KERNEL_ZIP_URL" ]; then
            echo "::error::未配置仓库变量 KERNEL_ZIP_URL（macOS kernel.zip 下载地址）"
            exit 1
          fi
          mkdir -p src-tauri/resources
          curl -fL "$KERNEL_ZIP_URL" -o src-tauri/resources/kernel.zip
      - name: Build universal app (ad-hoc)
        run: UNIVERSAL=1 ./scripts/bundle.sh
      - name: Build DMG
        run: UNIVERSAL=1 ./scripts/build-dmg.sh
      - name: Normalize DMG name
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          mv "$DMG" "src-tauri/target/release/bundle/dmg/PPClash-${VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/PPClash-*-macos-universal.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm ci
      - name: Fetch Windows kernel
        shell: pwsh
        env:
          KERNEL_ZIP_URL_WINDOWS: ${{ vars.KERNEL_ZIP_URL_WINDOWS }}
          KERNEL_ZIP_URL: ${{ vars.KERNEL_ZIP_URL }}
        run: |
          $url = $env:KERNEL_ZIP_URL_WINDOWS
          if (-not $url) { $url = $env:KERNEL_ZIP_URL }
          if (-not $url) { throw "未配置 KERNEL_ZIP_URL_WINDOWS / KERNEL_ZIP_URL" }
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Invoke-WebRequest -Uri $url -OutFile src-tauri/resources/kernel.zip
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Normalize installer name
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $file = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Rename-Item $file.FullName "PPClash-$version-windows-amd64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/PPClash-*-windows-amd64-setup.exe

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path("artifacts")
          lines = []
          for path in sorted(root.iterdir()):
              if path.suffix.lower() in {".dmg", ".exe"}:
                  h = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{h}  {path.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.dmg artifacts/*.exe artifacts/SHA256SUMS \
            --title "PP Clash $GITHUB_REF_NAME" \
            --notes "macOS ad-hoc DMG + Windows NSIS installer" || \
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/*.dmg artifacts/*.exe artifacts/SHA256SUMS --clobber
