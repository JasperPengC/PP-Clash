name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npx vitest run
      - name: Build frontend
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare compile-only resource placeholder
        run: |
          mkdir -p src-tauri/resources
          [ -f src-tauri/resources/kernel.zip ] || {
            printf 'placeholder\n' > /tmp/version.txt
            (cd /tmp && zip -q "$GITHUB_WORKSPACE/src-tauri/resources/kernel.zip" version.txt)
          }
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
