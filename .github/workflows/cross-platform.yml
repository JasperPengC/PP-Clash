name: Cross-platform build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-universal:
    timeout-minutes: 120
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Compile Universal app shell (not a release package)
        run: ./scripts/ci.sh build-macos
      - uses: actions/upload-artifact@v4
        with:
          name: PP-Clash-macos-universal-compile-only
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/ppclash
            src-tauri/target/aarch64-apple-darwin/release/ppclash

  windows-compile:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        shell: bash
        run: ./scripts/ci.sh install
      - name: Frontend build
        shell: bash
        run: ./scripts/ci.sh build-web
      - name: Rust tests (Windows host)
        shell: bash
        run: ./scripts/ci.sh check-rust
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'amd64_arm64' || 'amd64' }}
      - name: Compile matching Windows architecture
        shell: bash
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target '${{ matrix.target }}'
