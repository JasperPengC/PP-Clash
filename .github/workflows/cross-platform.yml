name: Cross-platform build

on:
  workflow_dispatch:

jobs:
  macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal app
        run: ./scripts/ci.sh build-macos
      - uses: actions/upload-artifact@v4
        with:
          name: PP-Clash-macos-universal
          path: src-tauri/target/release/bundle/macos/PP Clash.app

  windows-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        shell: bash
        run: ./scripts/ci.sh install
      - name: Frontend build
        shell: bash
        run: ./scripts/ci.sh build-web
      - name: Rust tests (Windows)
        shell: bash
        run: ./scripts/ci.sh check-rust
